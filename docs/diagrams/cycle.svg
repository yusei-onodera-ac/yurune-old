<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif"><rect width="1200" height="440" fill="#FFFFFF"/><text x="32" y="50" font-size="25" fill="#1D2326" font-weight="700" text-anchor="start">夜のくり返しと、週の見直し</text><text x="32" y="80" font-size="16" fill="#69757B" font-weight="400" text-anchor="start">丸は 1 夜です。最初の 7 夜で基準をとり、そのあとは、3 夜に 1 夜を標準の夜にします。</text><rect x="53.75" y="144" width="263.5" height="104" rx="6" fill="#F2F4F4"/><text x="185.5" y="276" font-size="14" fill="#69757B" font-weight="400" text-anchor="middle">第1週</text><rect x="323.25" y="144" width="263.5" height="104" rx="6" fill="#F2F4F4"/><text x="455" y="276" font-size="14" fill="#69757B" font-weight="400" text-anchor="middle">第2週</text><rect x="592.75" y="144" width="263.5" height="104" rx="6" fill="#F2F4F4"/><text x="724.5" y="276" font-size="14" fill="#69757B" font-weight="400" text-anchor="middle">第3週</text><rect x="862.25" y="144" width="263.5" height="104" rx="6" fill="#F2F4F4"/><text x="994" y="276" font-size="14" fill="#69757B" font-weight="400" text-anchor="middle">第4週</text><line x1="570.5" y1="144" x2="570.5" y2="126" stroke="#2E8C87" stroke-width="2"/><text x="570.5" y="116" font-size="14.5" fill="#2E8C87" font-weight="700" text-anchor="middle">見直し</text><line x1="840" y1="144" x2="840" y2="126" stroke="#2E8C87" stroke-width="2"/><text x="840" y="116" font-size="14.5" fill="#2E8C87" font-weight="700" text-anchor="middle">見直し</text><line x1="1109.5" y1="144" x2="1109.5" y2="126" stroke="#2E8C87" stroke-width="2"/><text x="1109.5" y="116" font-size="14.5" fill="#2E8C87" font-weight="700" text-anchor="middle">見直し</text><circle cx="70" cy="196" r="12" fill="#8DA09E"/><circle cx="108.5" cy="196" r="12" fill="#8DA09E"/><circle cx="147" cy="196" r="12" fill="#8DA09E"/><circle cx="185.5" cy="196" r="12" fill="#8DA09E"/><circle cx="224" cy="196" r="12" fill="#8DA09E"/><circle cx="262.5" cy="196" r="12" fill="#8DA09E"/><circle cx="301" cy="196" r="12" fill="#8DA09E"/><circle cx="339.5" cy="196" r="10.5" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><circle cx="378" cy="196" r="10.5" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><circle cx="416.5" cy="196" r="12" fill="#8DA09E"/><circle cx="455" cy="196" r="10.5" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><circle cx="493.5" cy="196" r="10.5" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><circle cx="532" cy="196" r="12" fill="#8DA09E"/><circle cx="570.5" cy="196" r="10.5" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><circle cx="609" cy="196" r="10.5" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><circle cx="647.5" cy="196" r="12" fill="#8DA09E"/><circle cx="686" cy="196" r="10.5" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><circle cx="724.5" cy="196" r="10.5" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><circle cx="763" cy="196" r="12" fill="#8DA09E"/><circle cx="801.5" cy="196" r="10.5" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><circle cx="840" cy="196" r="10.5" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><circle cx="878.5" cy="196" r="12" fill="#8DA09E"/><circle cx="917" cy="196" r="10.5" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><circle cx="955.5" cy="196" r="10.5" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><circle cx="994" cy="196" r="12" fill="#8DA09E"/><circle cx="1032.5" cy="196" r="10.5" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><circle cx="1071" cy="196" r="10.5" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><circle cx="1109.5" cy="196" r="12" fill="#8DA09E"/><path d="M 58 304 v 8 h 255 v -8" fill="none" stroke="#69757B" stroke-width="1.5"/><text x="185.5" y="338" font-size="15" fill="#1D2326" font-weight="700" text-anchor="middle">基準</text><text x="185.5" y="362" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="middle">標準のすごし方で、夜のようすを見る</text><path d="M 327.5 304 v 8 h 794 v -8" fill="none" stroke="#69757B" stroke-width="1.5"/><text x="724.5" y="338" font-size="15" fill="#1D2326" font-weight="700" text-anchor="middle">3 夜に 1 夜が標準。ほかの夜は、音か、音量の下げ方を、1 つだけ変える</text><text x="724.5" y="362" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="middle">見直しの日に、変えた夜を、日の近い標準の夜と組にして比べ、よく使う・外す・戻す・もう少し見る、を決める</text><circle cx="40" cy="418" r="8" fill="#8DA09E"/><text x="56" y="423" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">標準の夜</text><circle cx="150" cy="418" r="7" fill="#FFFFFF" stroke="#2E8C87" stroke-width="3"/><text x="166" y="423" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">少し変えた夜</text></svg>