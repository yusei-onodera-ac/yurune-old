<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif"><rect width="1200" height="760" fill="#FFFFFF"/><text x="32" y="50" font-size="25" fill="#1D2326" font-weight="700" text-anchor="start">ゆるね  Google Cloud の構成</text><text x="32" y="80" font-size="16" fill="#69757B" font-weight="400" text-anchor="start">夜の制御、会話、週の見直しは、Cloud Run の 1 つのアプリで動きます</text><rect x="32" y="112" width="270" height="600" rx="6" fill="#FFFFFF" stroke="#D5DDDE" stroke-width="1.5"/><text x="52" y="146" font-size="17" fill="#1D2326" font-weight="700" text-anchor="start">利用者の端末</text><text x="52" y="170" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">スマホのブラウザ（PWA）</text><rect x="48" y="190" width="238" height="114" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="64" y="220" font-size="17" fill="#1D2326" font-weight="700" text-anchor="start">画面</text><text x="64" y="245" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">JSP と JavaScript。</text><text x="64" y="266" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">ぽてねの最新の返事を、</text><text x="64" y="287" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">1 行だけ出す</text><rect x="48" y="316" width="238" height="114" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="64" y="346" font-size="17" fill="#1D2326" font-weight="700" text-anchor="start">環境音</text><text x="64" y="371" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">雨、波、森を、</text><text x="64" y="392" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">端末の中で合成する</text><text x="64" y="413" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">（Web Audio）</text><rect x="48" y="442" width="238" height="114" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="64" y="472" font-size="17" fill="#1D2326" font-weight="700" text-anchor="start">声を文字にする</text><text x="64" y="497" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">ブラウザの音声認識。</text><text x="64" y="518" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">音声は、このアプリの</text><text x="64" y="539" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">サーバーに送らない</text><rect x="48" y="568" width="238" height="114" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="64" y="598" font-size="17" fill="#1D2326" font-weight="700" text-anchor="start">ぽてねの声</text><text x="64" y="623" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">サーバーでつくった声を、</text><text x="64" y="644" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">環境音と同じ出力で</text><text x="64" y="665" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">流す</text><rect x="386" y="112" width="380" height="600" rx="6" fill="#FFFFFF" stroke="#D5DDDE" stroke-width="1.5"/><text x="406" y="146" font-size="17" fill="#1D2326" font-weight="700" text-anchor="start">アプリ（Cloud Run・東京）</text><text x="406" y="170" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">Java 21 + Tomcat 10.1。インスタンスは 1〜3</text><rect x="402" y="190" width="348" height="92" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="422" y="219" font-size="17" fill="#1D2326" font-weight="700" text-anchor="start">固定の枠（コード）</text><text x="422" y="243" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">入出力の検査、音量と呼び出しの上限、</text><text x="422" y="264" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">夜を終える条件、決めた文</text><rect x="402" y="293" width="348" height="92" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><rect x="402" y="293" width="5" height="92" rx="2" fill="#2E8C87" stroke="none" stroke-width="0"/><text x="422" y="322" font-size="17" fill="#1D2326" font-weight="700" text-anchor="start">夜の制御</text><text x="422" y="346" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">反応を見て、ツールを選ぶ。</text><text x="422" y="367" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">使えないときは、規則だけで動く</text><rect x="402" y="396" width="348" height="92" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><rect x="402" y="396" width="5" height="92" rx="2" fill="#2E8C87" stroke="none" stroke-width="0"/><text x="422" y="425" font-size="17" fill="#1D2326" font-weight="700" text-anchor="start">会話</text><text x="422" y="449" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">検査を通した発言を、</text><text x="422" y="470" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">ぽてねとして返す</text><rect x="402" y="499" width="348" height="92" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="422" y="528" font-size="17" fill="#1D2326" font-weight="700" text-anchor="start">週の見直し</text><text x="422" y="552" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">近い夜どうしを比べる検定と規則。</text><text x="422" y="573" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">AI は使わない</text><rect x="402" y="602" width="348" height="92" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="422" y="631" font-size="17" fill="#1D2326" font-weight="700" text-anchor="start">判断の記録</text><text x="422" y="655" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">見たこと、選んだこと、理由。</text><text x="422" y="676" font-size="14.5" fill="#69757B" font-weight="400" text-anchor="start">会話の本文は含めない</text><rect x="850" y="112" width="318" height="600" rx="6" fill="#FFFFFF" stroke="#D5DDDE" stroke-width="1.5"/><text x="870" y="146" font-size="17" fill="#1D2326" font-weight="700" text-anchor="start">つないでいるサービス</text><text x="870" y="170" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">Google Cloud</text><rect x="866" y="186" width="286" height="63" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="882" y="212" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">Firestore</text><text x="1136" y="212" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="end">東京</text><text x="882" y="235" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="start">利用者ごとのデータを保存</text><rect x="866" y="259" width="286" height="63" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="882" y="285" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">Firebase Authentication</text><text x="882" y="308" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="start">メールとパスワード</text><rect x="866" y="332" width="286" height="63" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="882" y="358" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">Secret Manager</text><text x="882" y="381" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="start">Gemini のキー</text><rect x="866" y="405" width="286" height="63" rx="6" fill="#DDEFED" stroke="#2E8C87" stroke-width="1.5"/><text x="882" y="431" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">Gemini API</text><text x="882" y="454" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="start">夜の判断と、ぽてねの会話</text><rect x="866" y="478" width="286" height="63" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="882" y="504" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">Model Armor</text><text x="1136" y="504" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="end">米国</text><text x="882" y="527" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="start">入力と返事の検査</text><rect x="866" y="551" width="286" height="63" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="882" y="577" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">Cloud Text-to-Speech</text><text x="882" y="600" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="start">ぽてねの声</text><rect x="866" y="624" width="286" height="63" rx="6" fill="#F2F4F4" stroke="none" stroke-width="1.5"/><text x="882" y="650" font-size="15.5" fill="#1D2326" font-weight="700" text-anchor="start">Cloud Logging / Monitoring</text><text x="882" y="673" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="start">ログ、メトリクス、アラート、予算</text><line x1="310" y1="412" x2="378" y2="412" stroke="#69757B" stroke-width="1.5"/><path d="M 386 412 l -9 -5 l 0 10 z" fill="#69757B"/><path d="M 302 412 l 9 -5 l 0 10 z" fill="#69757B"/><text x="344" y="398" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="middle">HTTPS</text><line x1="774" y1="412" x2="842" y2="412" stroke="#69757B" stroke-width="1.5"/><path d="M 850 412 l -9 -5 l 0 10 z" fill="#69757B"/><path d="M 766 412 l 9 -5 l 0 10 z" fill="#69757B"/><text x="808" y="398" font-size="13.5" fill="#69757B" font-weight="400" text-anchor="middle">API</text><rect x="32" y="722" width="5" height="24" rx="2" fill="#2E8C87" stroke="none" stroke-width="0"/><text x="48" y="740" font-size="14" fill="#69757B" font-weight="400" text-anchor="start">青緑の印は、Gemini に聞く所です。ほかは、コードだけで決まります。</text></svg>